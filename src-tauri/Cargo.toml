[package]
name = "Limacina"
version = "1.3.1"
description = "Limacina — Minecraft launcher"
authors = ["Tekina"]
edition = "2021"

[lib]
name = "limacina_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
walkdir = "2.3"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "stream", "multipart", "query", "native-tls", "charset", "http2", "system-proxy"] }
anyhow = "1"
futures = "0.3"
zip = { version = "8.6", default-features = false, features = ["deflate-flate2"] }
uuid = { version = "1", features = ["v4", "fast-rng", "macro-diagnostics"] }
md-5 = "0.11"
sha1 = "0.11"
sha2 = "0.11"
async-trait = "0.1.89"
toml = "1.1.2"
fastnbt = "2"
quick-xml = { version = "0.42", features = ["serialize"] }
tar = "0.4.46"
flate2 = "1.1.9"
keyring = { version = "3", features = ["sync-secret-service", "windows-native"] }
dirs = "6"
tauri-plugin-dialog = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-autostart = "2"
tauri-plugin-notification = "2"
discord-rich-presence = "1.1.0"
sysinfo = "0.38"



